# Local Postgres and Electric for development and E2E. Production uses Neon and self-hosted Electric on Fly.io (same image version).
name: goblins
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: goblins
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_connections=200"]
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      retries: 30
  electric:
    image: electricsql/electric:1.8.1
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/goblins?sslmode=disable
      ELECTRIC_INSECURE: "true"
      # Default is 300 concurrent initial (snapshot) requests; a class bell exceeds it and every
      # extra request gets a 503 with Retry-After 8-10 s. Production sets the same on Fly.
      ELECTRIC_MAX_CONCURRENT_REQUESTS: '{"initial": 3000, "existing": 20000}'
    ports: ["30001:3000"]
    depends_on:
      postgres:
        condition: service_healthy
