name: E2E

# Runs the Playwright suite against the app built from this commit, with
# Postgres and Electric in Docker (apps/web/docker-compose.yml) and the mock
# model. Previews have no Electric, so they can't run the live flows.
on:
  pull_request:
  push:
    branches: [main]

# The job runs code from the PR, so its token can only read.
permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No Clerk keys: with AUTH_MODE=local (apps/web/local.env) the app skips Clerk, so PR code
    # never sees a credential.
    env:
      MODEL_CLIENT: mock
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Postgres and Electric
        run: docker compose -f apps/web/docker-compose.yml up -d --wait
      - name: Migrate
        run: pnpm --filter @goblins/domain db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:55432/goblins
      - run: pnpm --filter @goblins/web build
      - name: Start the app
        working-directory: apps/web
        run: |
          PORT=3000 nohup node --env-file=local.env .output/server/index.mjs > ../../server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000 && exit 0; sleep 1; done
          cat ../../server.log; exit 1
      - run: pnpm --filter @goblins/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          E2E_BASE_URL: http://localhost:3000
      - if: failure()
        run: |
          cat server.log
          docker compose -f apps/web/docker-compose.yml logs --tail 100
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
            server.log
          retention-days: 7
