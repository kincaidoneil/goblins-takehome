# Postgres and Electric for dry-running the load test locally. Separate ports and project name
# from apps/web's stack, so a load test never touches a developer's data.
name: goblins-loadtest
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: goblins
    # Neon's free tier allows about 100 direct connections; keep the local cap close to it.
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_connections=200"]
    ports: ["55433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      retries: 30
  electric:
    image: electricsql/electric:latest
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/goblins?sslmode=disable
      ELECTRIC_INSECURE: "true"
    ports: ["30002:3000"]
    depends_on:
      postgres:
        condition: service_healthy
